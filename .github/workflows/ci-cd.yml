name: CI/CD Pipeline

on:
  pull_request:
    branches: [dev]

  push:
    branches: [dev, main]

jobs:

  # 🧪 CI (Pull Request → dev)
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd backend && npm install
          cd ../frontend && npm install

      # 🧹 Lint
      - name: Lint
        run: |
          cd backend && npm run lint || echo "no lint"
          cd ../frontend && npm run lint || echo "no lint"

      # 🔍 Audit
      - name: npm audit
        run: |
          cd backend && npm audit || true
          cd ../frontend && npm audit || true

      # 🔐 Snyk
      - name: Snyk security test
        run: |
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }}
          cd backend && snyk test || true

      # 🧪 Tests
      - name: Run tests
        run: |
          cd backend && npm test || echo "no tests"
          cd ../frontend && npm test || echo "no tests"

      # 🐳 Build Docker (validation)
      - name: Build Docker images
        run: docker compose build

  # 🚀 CD (push sur main uniquement)
  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Login Docker Hub
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 📄 Créer .env
      - name: Create .env file
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env

      # 🐳 Build production images
      - name: Build images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:prod ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:prod ./backend

      # 🚀 Push Docker Hub
      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:prod
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:prod